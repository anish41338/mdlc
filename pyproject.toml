[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlc"
version = "0.1.0"
description = "Mini Deep-Learning Compiler: ONNX to fused CUDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnx>=1.15",
]

[project.optional-dependencies]
# Reference/oracle + model export. Not required to run the compiler itself.
ref = ["onnxruntime>=1.16"]
torch = ["torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["mdlc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
